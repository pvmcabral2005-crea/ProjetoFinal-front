<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title> Gerenciador de Usuários</title>
</head>

<body>
    <div id="container">
        <h2><u>Cadastrar Novos Usuários</u></h2>
        <div class="cadastro">

            <form id="formularioUsuario">
                <input type="text" id="nome" name="nome" placeholder="Nome Completo">
                <input type="text" id="cargo" name="cargo" placeholder="Cargo ou função">

                <button id="botao" type="submit">Salvar cadastros no Sistema</button>
            </form>
        </div>
        <div class="box">
            <h2> Usuários Cadastrados</h2>
            <ul id="listaVisual">

            </ul>

        </div>
    </div>
    <script src="script.js"></script>
</body>


</html>
